name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ios-check:
    name: iOS check (no signing)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      # يتأكد أن كود iOS بيكومبايل على ماك بدون توقيع
      - run: flutter build ios --no-codesign

  ios-ipa:
    name: iOS IPA (signed, manual)
    # شغله يدوي فقط بعد ما تضيف الـ secrets
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Build signed IPA
        run: >
          flutter build ipa
          --release
          --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
