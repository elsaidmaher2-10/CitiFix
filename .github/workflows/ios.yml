name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ios-check:
    name: iOS check (no signing)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - run: flutter --version
      - run: flutter clean
      - name: Pub get (with diagnostics)
        run: |
          flutter doctor
          set +e
          flutter pub get --enforce-lockfile > /tmp/pub_enforce.log 2>&1
          CODE=$?
          echo "enforce-lockfile exit code: $CODE"
          if [ $CODE -ne 0 ]; then
            echo "--- enforce failed, retrying plain pub get ---"
            flutter pub get > /tmp/pub_plain.log 2>&1
            CODE=$?
            echo "plain pub get exit code: $CODE"
          fi
          set -e
          if [ $CODE -ne 0 ]; then
            echo "--- tail of failing pub log ---"
            tail -n 40 /tmp/pub_plain.log
            echo "--- publishing tail as annotations ---"
            tail -n 8 /tmp/pub_plain.log | while IFS= read -r line; do echo "::error::$line"; done
            exit $CODE
          fi
          tail -n 5 /tmp/pub_enforce.log
          echo "pub get OK"
      - run: flutter precache --ios
      - run: mkdir -p build/ios/SourcePackages
      # regenerates Podfile if missing (safe, does not touch lib/)
      - run: flutter create --platforms=ios .
      - run: flutter analyze
      # Workaround for "Failed to copy plugin ... rsync: mkdir ... failed":
      # pre-create every Firebase SPM dir from the actual resolved versions
      # instead of hardcoding one version that will drift.
      - name: Pre-create Firebase SPM dirs
        run: |
          mkdir -p build/ios/SourcePackages
          for d in ~/.pub-cache/hosted/pub.dev/firebase_*-* ~/.pub-cache/hosted/pub.dev/cloud_*-*; do
            if [ -d "$d" ]; then
              mkdir -p "build/ios/SourcePackages/$(basename "$d")"
            fi
          done
          ls build/ios/SourcePackages
      # config-only first so Xcode project + SPM dirs exist before plugin copy
      - run: flutter build ios --config-only || flutter build ios --config-only
      # يتأكد أن كود iOS بيكومبايل على ماك بدون توقيع
      - run: flutter build ios --debug --no-codesign --verbose || flutter build ios --debug --no-codesign --verbose

  ios-ipa:
    name: iOS IPA (signed, manual)
    # شغله يدوي فقط بعد ما تضيف الـ secrets
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - run: flutter clean
      - run: flutter pub get --enforce-lockfile || flutter pub get
      - run: flutter precache --ios
      - run: mkdir -p build/ios/SourcePackages
      - run: flutter create --platforms=ios .

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Build signed IPA
        run: >
          flutter build ipa
          --release
          --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
